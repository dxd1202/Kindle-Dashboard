<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日程 · Kindle Dashboard</title>
<link rel="stylesheet" href="/editor.css">
</head>
<body>
<main>
  <header>
    <p>Kindle Dashboard <span id="filename"></span></p>
    <h1>日程</h1>
    <nav aria-label="编辑器"><a href="/">任务</a><a href="/calendar" aria-current="page">日程</a></nav>
  </header>

  <form id="editor">
    <h2 id="form-heading">新增日程</h2>
    <div class="fields calendar-fields">
      <label class="wide">日程名称<input name="title" required placeholder="例如：排球训练"></label>
      <label>地点（可选）<input name="place"></label>
      <label>日期<input name="date" type="date" required></label>
      <label id="start-time">开始时间（北京时间）<input name="start" type="time" step="1" required></label>
      <label><span id="end-label">结束日期和时间（可选）</span><input name="end" type="datetime-local" step="1"></label>
      <label><span><input name="all_day" type="checkbox"> 全天日程</span></label>
    </div>
    <div class="actions calendar-actions">
      <button type="button" data-day="0" disabled>今天</button>
      <button type="button" data-day="1" disabled>明天</button>
      <button class="primary" id="submit" disabled>添加日程</button>
      <button type="button" id="cancel" hidden>取消编辑</button>
    </div>
    <div class="form-footer">
      <p class="status" id="status" role="status"></p>
      <button type="button" id="reload" hidden>重新读取日程</button>
    </div>
  </form>

  <div class="actions">
    <label>查看日期 <input id="view-date" type="date" disabled></label>
    <button type="button" id="view-today" disabled>回到今天</button>
  </div>
  <section id="days" aria-label="日程列表"></section>
</main>
<script>
"use strict";
const form = document.getElementById("editor");
const submit = document.getElementById("submit");
const reload = document.getElementById("reload");
const cancel = document.getElementById("cancel");
const status = document.getElementById("status");
const viewDate = document.getElementById("view-date");
const viewToday = document.getElementById("view-today");
const shortcuts = document.querySelectorAll("[data-day]");
let calendar;
let editing;
let busy = false;

function setBusy(value) {
  busy = value;
  for (const input of form.querySelectorAll("input")) input.disabled = busy || !calendar?.writable;
  submit.disabled = busy || !calendar?.writable;
  reload.disabled = busy;
  cancel.disabled = busy;
  viewDate.disabled = busy || !calendar;
  viewToday.disabled = busy || !calendar;
  for (const shortcut of shortcuts) shortcut.disabled = submit.disabled;
  for (const button of document.querySelectorAll("#days button")) button.disabled = submit.disabled;
}

function message(text, error = false) {
  status.textContent = text;
  status.classList.toggle("error", error);
}

function syncAllDay() {
  const allDay = form.elements.all_day.checked;
  document.getElementById("start-time").hidden = allDay;
  form.elements.start.required = !allDay;
  const end = form.elements.end;
  const endType = allDay ? "date" : "datetime-local";
  if (end.type !== endType) {
    const previous = end.value;
    end.value = "";
    end.type = endType;
    if (previous) end.value = allDay ? previous.slice(0, 10) : previous + "T00:00";
  }
  document.getElementById("end-label").textContent = allDay ? "结束日期（可选，不含当天）" : "结束日期和时间（可选）";
}

function showForm(event) {
  editing = event;
  form.reset();
  form.elements.date.value = event?.start.slice(0, 10) ?? calendar.days[0].date;
  form.elements.title.value = event?.name ?? "";
  form.elements.place.value = event?.place ?? "";
  form.elements.all_day.checked = event?.all_day ?? false;
  syncAllDay();
  form.elements.start.value = event?.all_day ? "" : event?.start.slice(11) ?? "";
  form.elements.end.value = event?.end ?? "";
  document.getElementById("form-heading").textContent = event ? "编辑日程" : "新增日程";
  submit.textContent = event ? "保存修改" : "添加日程";
  cancel.hidden = !event;
}

function show(result) {
  calendar = result;
  viewDate.value = result.days[0].date;
  document.getElementById("filename").textContent = "· " + result.filename;
  const days = document.getElementById("days");
  days.replaceChildren();
  result.days.forEach(day => {
    const group = document.createElement("div");
    group.className = "task-group";
    const heading = document.createElement("h2");
    const relative = day.date === result.today ? "今天 · " : day.date === result.tomorrow ? "明天 · " : "";
    heading.textContent = relative + day.date;
    group.append(heading);
    const list = document.createElement("ul");
    for (const event of day.events) {
      const row = document.createElement("li");
      const time = document.createElement("time");
      time.className = "event-time";
      time.textContent = event.time;
      const details = document.createElement("div");
      details.className = "details";
      details.textContent = event.name;
      if (event.place) {
        const place = document.createElement("small");
        place.textContent = event.place;
        details.append(place);
      }
      row.append(time, details);
      if (result.writable) {
        const actions = document.createElement("div");
        actions.className = "actions";
        const edit = document.createElement("button");
        edit.type = "button";
        edit.textContent = "编辑";
        edit.addEventListener("click", () => {
          showForm(event);
          message(event.repeating ? "只修改选中的这一次日程。" : "");
          form.elements.title.focus();
        });
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "delete";
        remove.textContent = "删除";
        remove.addEventListener("click", () => {
          const prompt = event.repeating ? "只删除这一次「" : "删除「";
          if (window.confirm(prompt + event.name + "」？")) save({action: "delete", id: event.id});
        });
        actions.append(edit, remove);
        row.append(actions);
      }
      list.append(row);
    }
    if (day.events.length) group.append(list);
    else {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "暂无日程";
      group.append(empty);
    }
    days.append(group);
  });
  if (!form.elements.date.value) form.elements.date.value = result.days[0].date;
}

async function load(firstDay = "") {
  setBusy(true);
  try {
    const query = firstDay ? "?date=" + encodeURIComponent(firstDay) : "";
    const response = await fetch("/api/calendar" + query);
    const result = await response.json();
    if (!response.ok) throw new Error(result.error);
    show(result);
    showForm();
    reload.hidden = true;
    message(result.writable ? "" : "当前由 ICS_DATA 提供日程。改用 ICS 文件后即可编辑。");
  } catch (error) {
    message(error.message, true);
    reload.hidden = false;
  } finally {
    setBusy(false);
  }
}

for (const shortcut of shortcuts) {
  shortcut.addEventListener("click", () => {
    form.elements.date.value = shortcut.dataset.day === "0" ? calendar.today : calendar.tomorrow;
  });
}
reload.addEventListener("click", () => load(viewDate.value));
viewDate.addEventListener("change", () => { if (viewDate.value) load(viewDate.value); });
viewToday.addEventListener("click", () => load());
cancel.addEventListener("click", () => { showForm(); message(""); });
form.elements.all_day.addEventListener("change", syncAllDay);

async function save(change) {
  if (busy || !calendar?.writable) return;
  setBusy(true);
  try {
    const response = await fetch("/api/calendar", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({revision: calendar.revision, first_day: calendar.days[0].date, ...change}),
    });
    const result = await response.json();
    if (!response.ok) {
      if (response.status === 409) reload.hidden = false;
      throw new Error(result.error);
    }
    show(result);
    showForm();
    reload.hidden = true;
    message(change.action === "delete" ? "已从日历删除。" : "已写入 ICS。重新生成看板即可更新图片。");
  } catch (error) {
    message(error.message, true);
  } finally {
    setBusy(false);
  }
}

form.addEventListener("submit", event => {
  event.preventDefault();
  if (busy || !calendar?.writable) return;
  const fields = new FormData(form);
  const day = fields.get("date");
  const allDay = fields.has("all_day");
  save({
    action: editing ? "edit" : "add", id: editing?.id, all_day: allDay,
    title: fields.get("title"), place: fields.get("place"),
    start: allDay ? day : day + "T" + fields.get("start"), end: fields.get("end"),
  });
});
load();
</script>
</body>
</html>
