name: Kindle Dashboard Auto Update
on:
  workflow_dispatch:

concurrency:
  group: kindle-dashboard-pages

jobs:
  build_and_run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate public dashboard
        id: public
        env:
          WEATHER_KEY: ${{ secrets.WEATHER_KEY }}
          WEATHER_HOST: ${{ secrets.WEATHER_HOST }}
          SEMESTER_START: ${{ vars.SEMESTER_START }}
          SEMESTER_WEEKS: ${{ vars.SEMESTER_WEEKS }}
          PYTHONIOENCODING: utf-8
        run: |
          publish_dir="$(mktemp -d "$RUNNER_TEMP/kindle-pages.XXXXXX")"
          python main.py --hide-timetable --output "$publish_dir/output.png"
          touch "$publish_dir/.nojekyll"
          printf 'directory=%s\n' "$publish_dir" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.public.outputs.directory }}
          publish_branch: gh-pages
