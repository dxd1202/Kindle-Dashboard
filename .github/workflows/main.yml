name: Kindle Dashboard Auto Update
on:
  workflow_dispatch:

concurrency:
  group: kindle-dashboard-pages

jobs:
  build_and_run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Dependencies
        run: python -m pip install -r requirements.txt

      - name: Install dashboard fonts
        run: |
          font_dir="$HOME/.local/share/fonts/kindle-dashboard"
          mkdir -p "$font_dir"
          downloads="$(mktemp -d)"
          trap 'rm -rf "$downloads"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip \
            --output "$downloads/inter.zip"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/be5invis/Sarasa-Gothic/releases/download/v1.0.43/SarasaGothicSC-TTF-1.0.43.7z \
            --output "$downloads/sarasa.7z"
          unzip -jo "$downloads/inter.zip" '*/Inter-Regular.ttf' '*/Inter-SemiBold.ttf' -d "$font_dir"
          7z e -y "$downloads/sarasa.7z" "-o$font_dir" -r SarasaGothicSC-Regular.ttf SarasaGothicSC-Bold.ttf
          fc-cache -f "$font_dir"
          python - <<'PY'
          from kindle_dashboard.render import add_system_fonts

          config = {}
          add_system_fonts(config)
          if set(config.get("dashboard_fonts", {})) != {"Regular", "Bold"}:
              raise SystemExit("Inter and Sarasa Gothic SC font stacks were not found")
          PY

      - name: Generate full dashboard
        id: public
        env:
          WEATHER_KEY: ${{ secrets.WEATHER_KEY }}
          WEATHER_HOST: ${{ secrets.WEATHER_HOST }}
          SEMESTER_START: ${{ vars.SEMESTER_START }}
          SEMESTER_WEEKS: ${{ vars.SEMESTER_WEEKS }}
          ICS_FILE: 2026Autumn.ics
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          from datetime import date
          from os import environ
          from pathlib import Path

          from icalendar import Calendar

          from kindle_dashboard.tasks import decode_tasks

          for name in ("SEMESTER_START", "SEMESTER_WEEKS"):
              if not environ.get(name, "").strip():
                  raise SystemExit(f"Missing {name}: add it under Actions > Variables > Repository variables")
          try:
              start = date.fromisoformat(environ["SEMESTER_START"])
              weeks = int(environ["SEMESTER_WEEKS"])
              if start.isoformat() != environ["SEMESTER_START"] or weeks < 1:
                  raise ValueError
          except ValueError:
              raise SystemExit("Use YYYY-MM-DD for SEMESTER_START and a positive integer for SEMESTER_WEEKS")
          print(f"Semester configuration: {start}, {weeks} weeks")

          calendar_path = Path(environ["ICS_FILE"])
          tasks_path = Path("tasks.local.json")
          for path in (calendar_path, tasks_path):
              if not path.is_file():
                  raise SystemExit(f"Missing {path}: commit and push the source file to main")
          try:
              Calendar.from_ical(calendar_path.read_bytes())
          except (OSError, ValueError):
              raise SystemExit(f"{calendar_path} must contain a valid ICS calendar")
          try:
              decode_tasks(tasks_path.read_bytes())
          except (OSError, ValueError):
              raise SystemExit(f"{tasks_path} must contain a valid JSON array")
          PY
          publish_dir="$(mktemp -d "$RUNNER_TEMP/kindle-pages.XXXXXX")"
          python main.py --output "$publish_dir/output.png"
          touch "$publish_dir/.nojekyll"
          printf 'directory=%s\n' "$publish_dir" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.public.outputs.directory }}
          publish_branch: gh-pages
