<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f5ef">
  <meta name="description" content="查看天气、今天和明天的日程、截止和待办。">
  <title>Kindle Dashboard</title>
  <link rel="stylesheet" href="app.css">
  <script src="task-sync.js" defer></script>
  <script src="workflow-sync.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <a class="brand" href="#tasks">Kindle Dashboard</a>
      <div class="masthead-actions">
        <button class="update-dashboard" type="button" id="update-dashboard" aria-controls="update-form" aria-expanded="false" hidden>更新看板</button>
        <button class="refresh" type="button" id="refresh" title="读取已发布数据" aria-label="读取已发布数据">↻</button>
      </div>
    </header>
    <form class="panel" id="update-form" hidden>
      <label class="editor-field">GitHub 令牌（Actions 读写）
        <input id="update-token" type="password" autocomplete="off" required>
      </label>
      <div class="editor-actions">
        <button class="primary" type="submit">运行更新</button>
        <button type="button" id="cancel-update">取消</button>
      </div>
    </form>
    <div id="update-status" class="status" role="status" aria-live="polite" hidden></div>
    <div id="status" class="status" role="status" aria-live="polite">正在加载看板</div>
    <main id="main" tabindex="-1"></main>
    <noscript><p class="status">请启用 JavaScript，或打开 <a href="../output.png">Kindle 图片版</a>。</p></noscript>
  </div>
  <nav class="nav" aria-label="看板页面">
    <a href="#tasks" data-view="tasks">待办</a>
    <a href="#schedule" data-view="schedule">日程</a>
    <a href="#weather" data-view="weather">天气</a>
  </nav>
</body>
</html>
